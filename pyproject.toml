[project]
name = "political-mayhem-rts"
version = "0.1.0"
description = "POLITICAL MAYHEM: Battle for the Cities — Agentic AI, Custom MCP Server, Hybrid RAG & Evaluation Suite for Unity 6 / Photon Fusion 2 RTS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["ai/mcp-server/tests", "ai"]
pythonpath = ["."]
addopts = "-v"
